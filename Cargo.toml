[package]
name = "jhterminalx"
version = "0.1.0"
edition = "2024"
description = "Gestor de conexiones SSH múltiples con túneles y notas de comandos"
license = "MIT"
repository = "https://github.com/eguee23/JHTerminalx"
authors = ["eguee23"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
directories = "6.0.0"
eframe = "0.37.0"
getrandom = "0.4.3"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
vt100 = "0.18.1"
zeroize = "1.9.1"

# SSH: en Windows libssh2 usa la criptografía nativa del sistema (WinCNG), sin
# OpenSSL ni Perl. En Linux/macOS se compila OpenSSL incluido en el binario.
[target.'cfg(windows)'.dependencies]
ssh2 = "0.9.7"

[target.'cfg(not(windows))'.dependencies]
ssh2 = { version = "0.9.7", features = ["vendored-openssl"] }

# Optimiza las dependencias también en debug (Argon2 y el render son mucho más rápidos).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = true

[build-dependencies]
winresource = "0.1.34"

# Paquete .deb (cargo install cargo-deb && cargo deb)
[package.metadata.deb]
maintainer = "eguee23"
section = "net"
priority = "optional"
depends = "$auto"
extended-description = "Gestor de conexiones SSH múltiples (GUI) con almacén cifrado, túneles -L y notas de comandos."
assets = [
    ["target/release/jhterminalx", "usr/bin/", "755"],
    ["packaging/linux/jhterminalx.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/jhterminalx.png", "644"],
    ["LICENSE", "usr/share/doc/jhterminalx/", "644"],
]
